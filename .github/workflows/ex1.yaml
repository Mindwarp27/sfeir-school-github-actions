name: npm-test
on: 
  workflow_dispatch:          
jobs:
  job1:
    runs-on: ubuntu-latest
    steps: 
     - name: Checkout
       uses: actions/checkout@v7
     - name: Setup node
       uses: actions/setup-node@v7
     - name: Run npm
       run: npm install  
    
  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps: 
     - name: Checkout
       uses: actions/checkout@v7
     - name: Setup node
       uses: actions/setup-node@v7
     - name: Run test
       run: npm test
