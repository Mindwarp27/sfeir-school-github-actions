name: npm test-thierry
on: 
  workflow_dispatch:          
jobs:
  job1-thierry:
    runs-on: ubuntu-latest
    steps: 
     - name: Checkout
       uses: actions/checkout@v7
     - name: Setup node
       uses: actions/setup-node@v7
     - name: Run npm
       run: npm install  
    
  job2-thierry:
    runs-on: ubuntu-latest
    needs: job1-thierry
    steps: 
     - name: Checkout
       uses: actions/checkout@v7
     - name: Setup node
       uses: actions/setup-node@v7
     - name: Run test
       run: npm test
