name: Switch Node version
on: 
  pull_request:
jobs:
  env: NODE_VERSION: 20
  run-npm-test:
    runs-on: ubuntu-latest
    steps:
        - name: checkout
          uses: actions/checkout@v6
        - name : setup node
          uses: actions/setup-node@v$6
          with:
            node-version: {{env.NODE_VERSION}}
        - name: run test
          shell: bash
          run: |
            echo "npm install"
            echo "npm test"
            node-v
