name: Reusable workflow - Ex4
env:
 NODE_VERSION: 20
on:
  workflow_dispatch:
    inputs:
     lts:
      required: false
      default: 'lts/*'
      type: string
jobs:
  run-npm-test:
    runs-on: ubuntu-latest
    steps:
        - name: checkout
          uses: actions/checkout@v6
        - name : setup node
          uses: actions/setup-node@v$6
          with:
            node-version: ${{inputs.lts}}
        - name: run test
          shell: bash
          run: |
            echo "npm install"
            echo "npm test"
            node-v

