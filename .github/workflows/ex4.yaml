name: Reusable workflow - Ex4
on:
  workflow_call:
    inputs:
     node-version:
      required: false
      default: 'lts/*'
      type: string
jobs:
  run-npm-test:
    runs-on: ubuntu-latest
    steps:
        - name: checkout
          uses: actions/checkout@v6
        - name : setup node
          uses: actions/setup-node@v6
          with:
            node-version: ${{inputs.node-version}}
        - name: run test
          shell: bash
          run: |
            echo "npm install"
            echo "npm test"
